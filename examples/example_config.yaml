actual_col: target
base_margin_col: null
early_stopping_maximize: false
early_stopping_metric: logloss
early_stopping_rounds: 20
evaluation:
  output_report: true
  plots_to_add:
  - plot: gain_curve_with_gini
    title: Gain Curve / Lorenz Curve
  - kwargs:
      top_percent: 15
    plot: partial_gini_plot
    title: Partial Gini (Top 15%)
  - plot: lift_chart
    title: Lift Chart
  - plot: crunched_residual_plot
    title: Crunched Residuals
  - kwargs:
      residual_type: normalized
    plot: plot_residual_fit
    title: Std and Avg of Normalized Residuals
  report_file: model_analysis.html
  report_params: {}
  tabulate_vars:
  - job
  - education
  - age
feval: logloss
hyperparameters:
  colsample_bytree: 0.5
  learning_rate: 0.1
  max_depth: 3
  n_estimators: 100
  objective: binary:logistic
  random_state: 42
  subsample: 0.5
log_eval_period: 50
log_file: training.log
model_file: model_obj.json
output_dir: outputs
output_log: true
predicted_col: pred_xgb
tuning:
  n_iter: 25
  objective_func: neg_normalized_gini
  output_tuning: true
  search_space:
    eta:
      high: 0.3
      low: 0.01
      type: real
    max_depth:
    - 3
    - 6
    subsample:
    - 0.6
    - 0.9
  tuning_file: tuning_results.csv
