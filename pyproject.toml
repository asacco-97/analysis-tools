[project]
name = "analysis-tools"
version = "0.1.0"
description = "Library containing model training and analysis tools."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas==2.3.1",
    "numpy==2.3.2",
    "scikit-learn==1.7.1",
    "matplotlib==3.10.3",
    "seaborn==0.13.2",
    "scikit-optimize==0.10.2",
    "pyyaml==6.0.2",
    "xgboost==3.0.2",
    "lightgbm==4.6.0",
    "catboost==1.2.8",
    "boto3==1.39.15",
    "jinja2==3.1.6",
]

[tool.uv]
dev-dependencies = [
  "jupyterlab",
  "ipython",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "analysis_report",
    "analysis_functions",
    "extract_notebook_to_markdown",
    "partial_gini_plot",
]

[tool.setuptools.packages.find]
where = ["src"]


